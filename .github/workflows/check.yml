name: check

# `nix flake check` on every PR and on main: every skill's frontmatter, the
# session-notes validator's tests, and the packages and Home Manager module for
# every system. Consumers (devsetup) pull main, so main must always pass.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake:
    name: nix flake check
    # The repository is public, and the Default runner group (arc-runner) refuses
    # public repositories; arc-runner-public is the set the 'public-repos' group
    # runs, and that group lists the repositories it serves. No Docker there, so
    # no job container: Nix is installed on the runner, as in token-usage.
    runs-on: arc-runner-public
    steps:
      - name: Install xz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xz-utils
      # Pinned to a commit SHA: a mutable tag on a third-party action can be
      # repointed at arbitrary code after review.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - uses: actions/checkout@v7
      - name: Check the flake
        run: nix flake check --all-systems
